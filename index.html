function sample(){return [...shuffle(BANK.filter(x=>x.level===1)).slice(0,4),...shuffle(BANK.filter(x=>x.level===2)).slice(0,4),...shuffle(BANK.filter(x=>x.level===3)).slice(0,2)]}
function levelName(l){return l===1?'בסיסי':l===2?'בינוני':'אתגר'}
function updateStepper(){const labs=['לומדים','מתנסים','מתרגלים','סיכום'];document.getElementById('stepper').innerHTML=labs.map((x,i)=>`${i?'<div class="connector '+(i<=S.stage?'filled':'')+'"></div>':''}<div class="step ${i===S.stage?'active':i<S.stage?'done':''}"><div class="circle">${i+1}</div><div class="label">${x}</div></div>`).join('')}
function setStage(n){S.stage=n;updateStepper();render()}
function render(){if(S.stage===0)renderTeach();if(S.stage===1)renderGuided();if(S.stage===2)renderPractice();if(S.stage===3)renderSummary()}
function renderTeach(){document.getElementById('card').innerHTML=`<h2 class="title">מה באמת קורה כשפותחים סוגריים?</h2><p class="sub">הגורם שמחוץ לסוגריים כופל <b>כל איבר</b> שנמצא בתוכם. רק אחרי שסיימנו לפתוח את כל הסוגריים מחפשים איברים דומים ומכנסים.</p><div class="teach-card"><div class="teach-original">${renderMath('3(2x-4)+5x')}</div><div class="why"><b>למה שתי מכפלות?</b><br>ה־${renderMath('3')} נמצא מחוץ לסוגריים, ולכן הוא מוכפל גם ב־${renderMath('2x')} וגם ב־${renderMath('-4')}.</div><div class="distribution"><div class="multiply-card"><div class="multiply-eq">${renderMath('3\\cdot2x')}</div><div class="arrow">↓</div><div class="multiply-eq"><b>${renderMath('6x')}</b></div></div><div class="multiply-card"><div class="multiply-eq">${renderMath('3\\cdot(-4)')}</div><div class="arrow">↓</div><div class="multiply-eq"><b>${renderMath('-12')}</b></div></div></div><div class="teach-caption">האיבר ${renderMath('+5x')} היה מחוץ לסוגריים ולכן פשוט נשאר.</div><div class="result-strip"><span class="term-chip same">${renderMath('6x')}</span><span class="term-chip constant">${renderMath('-12')}</span><span class="term-chip same">${renderMath('+5x')}</span></div><div class="teach-caption">עכשיו רואים ש־${renderMath('6x')} ו־${renderMath('5x')} הם איברים דומים.</div><div class="final-demo">${renderMath('6x-12+5x=11x-12')}</div></div><div class="actions"><button class="btn primary" onclick="setStage(1)">להתנסות</button></div>`;document.getElementById('footer').innerHTML='<span></span><span></span>'}

function initField(id){
  const mf=document.getElementById(id);
  if(!mf)return;
  mf.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const b=document.querySelector(`[data-check-for="${id}"]`);
      if(b)b.click();
    }
  });
}
function fieldBlock(id){
  return `<div class="math-entry-wrap"><div class="field-shell"><math-keyboard-field id="${id}" placeholder="הקלידו תשובה"></math-keyboard-field></div></div>`;
}
function guidedBody(){return `<h2 class="title">התנסות מודרכת</h2><p class="sub">הפעם אתם כותבים את הביטוי בעצמכם. אין תיבות קטנות ואין אותיות שמופיעות מראש.</p><div class="exercise">${renderMath('-3(2x-4)+5x')}</div><div class="work"><div class="work-step"><div class="work-title">1. פתחו את הסוגריים</div><div class="work-help">הכפילו את ${renderMath('-3')} בכל אחד משני האיברים שבסוגריים. כתבו בשדה את <b>כל הביטוי</b> שהתקבל. עדיין אל תכנסו איברים דומים.</div>${fieldBlock('gExpand')}<div class="actions"><button class="btn primary" data-check-for="gExpand" onclick="checkGuidedExpand()">בדיקה</button></div><div id="gfb"></div></div><div id="guidedFinal"></div></div>`}
function renderGuided(){document.getElementById('card').innerHTML=guidedBody();document.getElementById('footer').innerHTML=`<button class="btn ghost" onclick="setStage(0)">חזרה</button><span></span>`;initField('gExpand')}
function normalizeAscii(s){return String(s||'').replace(/−/g,'-').replace(/[·×]/g,'*').replace(/\s+/g,'').replace(/\*+/g,'*')}
function splitTerms(s){s=normalizeAscii(s).replace(/\*/g,'');if(!s)return[];if(/[()]/.test(s))return null;s=s.replace(/^-/, '§').replace(/-/g,'+-').replace(/^§/,'-');return s.split('+').filter(Boolean)}
function parseMonomial(t){let sign=1;if(t[0]==='+')t=t.slice(1);if(t[0]==='-'){sign=-1;t=t.slice(1)};let m=t.match(/^((?:\d+(?:\.\d+)?)?)(.*)$/);if(!m)return null;let coef=m[1]?Number(m[1]):1,rest=m[2];let vars={};while(rest){let vm=rest.match(/^([a-z])(?:\^\{?(\d+)\}?)?/i);if(!vm)return null;let v=vm[1],p=vm[2]?Number(vm[2]):1;vars[v]=(vars[v]||0)+p;rest=rest.slice(vm[0].length)};let sig=Object.keys(vars).sort().map(v=>v+'^'+vars[v]).join('*')||'#';return{coef:sign*coef,sig}}
function expandedSignature(s){let terms=splitTerms(s);if(!terms)return null;let arr=[];for(const t of terms){let m=parseMonomial(t);if(!m)return null;arr.push(m.sig+':'+m.coef)}return arr.sort().join('|')}
function polySignature(s){let terms=splitTerms(s);if(!terms)return null;let map={};for(const t of terms){let m=parseMonomial(t);if(!m)return null;map[m.sig]=(map[m.sig]||0)+m.coef}return Object.keys(map).filter(k=>Math.abs(map[k])>1e-9).sort().map(k=>k+':'+map[k]).join('|')}
function fieldAscii(id){const mf=document.getElementById(id);if(!mf)return'';try{return mf.getValue('ascii-math')}catch(e){return mf.value||''}}
function setFieldState(id,state){const sh=document.getElementById(id)?.parentElement;if(sh){sh.classList.remove('good','bad');if(state)sh.classList.add(state)}}
function checkGuidedExpand(){const val=fieldAscii('gExpand'),fb=document.getElementById('gfb');if(expandedSignature(val)!==expandedSignature('-6x+12+5x')){setFieldState('gExpand','bad');fb.className='feedback bad';fb.textContent=polySignature(val)===polySignature('-6x+12+5x')?'הביטוי שקול, אבל בשלב הזה רוצים לראות את כל האיברים מיד אחרי פתיחת הסוגריים — לפני הכינוס.':'עדיין לא. בדקו שה־‎−3‎ הוכפל גם ב־2x וגם ב־‎−4‎.';return}setFieldState('gExpand','good');document.getElementById('gExpand').setAttribute('readonly','');fb.className='feedback ok';fb.textContent='נכון. פתחתם את הסוגריים: ‎−6x + 12 + 5x‎.';document.getElementById('guidedFinal').innerHTML=`<div class="work-step"><div class="work-title">2. כנסו איברים דומים</div><div class="work-help">האיברים ${renderMath('-6x')} ו־${renderMath('+5x')} דומים. כתבו את <b>כל התשובה הסופית</b>.</div><div class="group-strip"><span class="g g0">${renderMath('-6x')}</span><span class="g g1">${renderMath('+12')}</span><span class="g g0">${renderMath('+5x')}</span></div>${fieldBlock('gFinal')}<div class="actions"><button class="btn primary" data-check-for="gFinal" onclick="checkGuidedFinal()">בדיקה</button></div><div id="gffb"></div></div>`;initField('gFinal')}
function checkGuidedFinal(){const v=fieldAscii('gFinal'),fb=document.getElementById('gffb');if(polySignature(v)!==polySignature('-x+12')){setFieldState('gFinal','bad');fb.className='feedback bad';fb.textContent='בדקו שוב: ‎−6x + 5x = −x‎, וה־12 נשאר.';return}setFieldState('gFinal','good');document.getElementById('gFinal').setAttribute('readonly','');fb.className='feedback ok';fb.innerHTML='מצוין! התוצאה היא '+renderMath('-x+12')+'.<div class="next-box"><button class="btn primary" onclick="showNameGate()">המשך לתרגול</button></div>'}

function showNameGate(){
  document.getElementById('card').innerHTML=`<div class="namegate"><h2 class="title">מוכנים לתרגול?</h2><p class="sub">תקבלו 10 תרגילים: 4 בסיסיים, אחריהם 4 בינוניים ולבסוף 2 תרגילי אתגר.<br>כדי לקבל תעודת סיום ולשלוח את התוצאה, מלאו שם ובחרו כיתה ושם מורה.</p><input id="studentName" placeholder="שם מלא" autocomplete="name"><select id="classInput"><option value="">טוען כיתות...</option></select><select id="teacherInput"><option value="">טוען מורים...</option></select><div id="listsFeedback" class="feedback" style="display:block;background:transparent;padding:4px"></div><div class="actions"><button class="btn ghost" id="retryListsBtn" style="display:none" onclick="loadLists()">נסו לטעון שוב</button><button class="btn primary" id="startPracticeBtn" onclick="startPractice()" disabled>התחלת התרגול</button></div></div>`;
  document.getElementById('footer').innerHTML=`<button class="btn ghost" onclick="renderGuided()">חזרה</button><span></span>`;
  const name=document.getElementById('studentName'),cls=document.getElementById('classInput'),teacher=document.getElementById('teacherInput');
  name.value=S.name||'';
  [name,cls,teacher].forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',validateGate));
  loadLists();
}
function validateGate(){
  const name=document.getElementById('studentName'),cls=document.getElementById('classInput'),teacher=document.getElementById('teacherInput'),btn=document.getElementById('startPracticeBtn');
  if(!name||!cls||!teacher||!btn)return;
  btn.disabled=!(name.value.trim()&&cls.value&&teacher.value&&!cls.disabled&&!teacher.disabled);
}
async function loadLists(){
  const cls=document.getElementById('classInput'),teacher=document.getElementById('teacherInput'),fb=document.getElementById('listsFeedback'),retry=document.getElementById('retryListsBtn'),btn=document.getElementById('startPracticeBtn');
  if(!cls||!teacher)return;
  cls.disabled=true;teacher.disabled=true;btn.disabled=true;retry.style.display='none';fb.textContent='';fb.className='feedback';
  cls.innerHTML='<option value="">טוען כיתות...</option>';teacher.innerHTML='<option value="">טוען מורים...</option>';
  try{
    const response=await fetch(SUBMISSION_URL);
    const data=await response.json();
    if(!response.ok||!data.success||!Array.isArray(data.classes)||!Array.isArray(data.teachers))throw new Error('לא ניתן לטעון את הרשימות');
    cls.innerHTML='<option value="">בחרו כיתה / קבוצה</option>';
    data.classes.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;cls.appendChild(o)});
    teacher.innerHTML='<option value="">בחרו שם מורה</option>';
    data.teachers.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;teacher.appendChild(o)});
    cls.disabled=false;teacher.disabled=false;
    if(S.className)cls.value=S.className;if(S.teacherName)teacher.value=S.teacherName;
    validateGate();
  }catch(err){
    console.error('Lists loading failed:',err);
    cls.innerHTML='<option value="">לא ניתן לטעון כיתות</option>';teacher.innerHTML='<option value="">לא ניתן לטעון מורים</option>';
    fb.textContent='לא ניתן לטעון את רשימות הכיתות והמורים. בדקו חיבור לאינטרנט ונסו שוב.';fb.className='feedback bad show';retry.style.display='';
  }
}
function startPractice(){
  const n=document.getElementById('studentName').value.trim(),cls=document.getElementById('classInput').value,teacher=document.getElementById('teacherInput').value;
  if(!n||!cls||!teacher)return;
  S.name=n;S.className=cls;S.teacherName=teacher;S.submitted=false;S.questions=sample();S.i=0;S.score=0;S.attempts=0;S.results=[];S.hadError=false;setStage(2)
}
function groupTerms(expanded){const raw=splitTerms(expanded)||[];const parsed=raw.map(t=>({t,m:parseMonomial(t)}));let sigs=[];parsed.forEach(o=>{if(!sigs.includes(o.m.sig))sigs.push(o.m.sig)});return parsed.map(o=>({text:o.t,sig:o.m.sig,idx:sigs.indexOf(o.m.sig)}))}
function formatTerm(t,i){let s=t;if(i>0&&!s.startsWith('-')&&!s.startsWith('+'))s='+'+s;return s}
function renderPractice(){const q=S.questions[S.i];document.getElementById('card').innerHTML=`<div class="qtop"><div class="counter">תרגיל ${S.i+1} מתוך 10</div><span class="badge l${q.level}">${levelName(q.level)}</span></div><div class="dots">${Array.from({length:10},(_,i)=>`<span class="dot ${S.results[i]===true?'ok':S.results[i]===false?'bad':''}"></span>`).join('')}</div><div class="exercise">${renderMath(q.original)}</div><div class="work"><div class="work-step"><div class="work-title">1. פתחו את הסוגריים</div><div class="work-help">כתבו משמאל לימין את <b>כל הביטוי שהתקבל</b> אחרי חוק הפילוג. בשלב הזה עדיין לא מכנסים.</div>${fieldBlock('pExpand')}<div class="actions"><button class="btn primary" data-check-for="pExpand" onclick="checkPracticeExpand()">בדיקת פתיחת הסוגריים</button></div><div id="pfb"></div></div><div id="pFinalArea"></div></div>`;document.getElementById('footer').innerHTML=`<button class="btn ghost" onclick="restartPractice()">התחלה מחדש</button><span>${S.score} הצלחות עד עכשיו</span>`;initField('pExpand')}
function checkPracticeExpand(){const q=S.questions[S.i],v=fieldAscii('pExpand'),fb=document.getElementById('pfb');S.attempts++;if(expandedSignature(v)!==expandedSignature(q.expanded)){S.hadError=true;setFieldState('pExpand','bad');fb.className='feedback bad';fb.textContent=polySignature(v)===polySignature(q.expanded)?'התוצאה שקולה, אבל דילגתם על שלב. כאן כתבו את כל האיברים מיד אחרי פתיחת הסוגריים, לפני הכינוס.':'יש טעות בפתיחת הסוגריים. בדקו שכל גורם שמחוץ לסוגריים הוכפל בכל איבר שבתוכם ושמרתם על הסימנים.';return}setFieldState('pExpand','good');document.getElementById('pExpand').setAttribute('readonly','');fb.className='feedback ok';fb.textContent='פתיחת הסוגריים נכונה.';showFinalStep(q)}
function showFinalStep(q){const groups=groupTerms(q.expanded);document.getElementById('pFinalArea').innerHTML=`<div class="work-step"><div class="work-title">2. כנסו איברים דומים</div><div class="work-help">אותו צבע מסמן איברים מאותה משפחה. כנסו אותם וכתבו בשדה את <b>כל התשובה הסופית</b>.</div><div class="expanded-show">${renderMath(q.expanded)}</div><div class="group-strip">${groups.map((g,i)=>`<span class="g g${g.idx%5}">${renderMath(formatTerm(g.text,i))}</span>`).join('')}</div>${fieldBlock('pFinal')}<div class="actions"><button class="btn primary" data-check-for="pFinal" onclick="checkPracticeFinal()">בדיקת התוצאה</button></div><div id="pffb"></div></div>`;initField('pFinal')}
function checkPracticeFinal(){const q=S.questions[S.i],v=fieldAscii('pFinal'),fb=document.getElementById('pffb');S.attempts++;if(polySignature(v)!==polySignature(q.final)){S.hadError=true;setFieldState('pFinal','bad');fb.className='feedback bad';fb.textContent='עדיין לא. כנסו רק איברים בעלי אותו חלק אותִי ואותן חזקות.';return}setFieldState('pFinal','good');document.getElementById('pFinal').setAttribute('readonly','');fb.className='feedback ok';if(S.results.length===S.i){if(!S.hadError)S.score++;S.results.push(!S.hadError)}const last=S.i===9;fb.innerHTML='נכון! '+renderMath(q.final)+`<div class="next-box"><button class="btn primary" onclick="nextPractice()">${last?'לסיכום':'הבא'}</button></div>`;const btn=document.querySelector('[data-check-for="pFinal"]');if(btn)btn.disabled=true}
function nextPractice(){S.i++;S.hadError=false;if(S.i>=10)setStage(3);else renderPractice()}
function restartPractice(){S.questions=sample();S.i=0;S.score=0;S.attempts=0;S.results=[];S.hadError=false;renderPractice()}

function renderSummary(){
  const pct=Math.round(S.score*10),date=new Intl.DateTimeFormat('he-IL').format(new Date());
  document.getElementById('card').innerHTML=`<div class="summary"><h2 class="title">סיימתם!</h2><div class="score">${S.score}/10</div><p class="sub">הציון מציין כמה תרגילים נפתרו ללא טעות. בכל שאלה יכולתם לתקן ולהמשיך.</p><div class="stats"><div class="stat"><b>${pct}%</b>דיוק</div><div class="stat"><b>${S.attempts}</b>בדיקות</div><div class="stat"><b>10</b>תרגילים</div></div><div class="certificate" id="certificate"><div style="font-size:2rem">🏆</div><div style="font-weight:900;color:var(--blue-deep);font-size:1.25rem">תעודת סיום</div><div>מוענקת ל־</div><div class="cert-name">${escapeHtml(S.name)}</div><div class="cert-meta">${escapeHtml(S.className)}</div><div class="cert-meta">המורה: ${escapeHtml(S.teacherName)}</div><div>על השלמת הלומדה<br><b>${escapeHtml(UNIT_NAME)}</b></div><div class="cert-score">${S.score}/10</div><div>${pct}% הצלחה ללא טעויות</div><div style="color:var(--muted);font-size:.85rem;margin-top:8px">${date}</div></div><div class="actions"><button class="btn primary" onclick="downloadCert()">הורדת התעודה כתמונה</button><button class="btn primary" id="submitBtn" onclick="submitResult()">שלח למורה</button></div><div id="submitFeedback" class="submit-status"></div></div>`;
  document.getElementById('footer').innerHTML=`<button class="btn ghost" onclick="restartAll()">תרגול חדש</button><span></span>`;
  if(S.submitted){
    const btn=document.getElementById('submitBtn'),fb=document.getElementById('submitFeedback');
    btn.disabled=true;btn.textContent='✓ התוצאה נשלחה';fb.textContent='התוצאה נשלחה למורה בהצלחה.';fb.className='submit-status ok';
  }
}
async function submitResult(){
  if(S.submitted)return;
  const btn=document.getElementById('submitBtn'),fb=document.getElementById('submitFeedback'),pct=Math.round(S.score*10);
  btn.disabled=true;btn.textContent='שולח...';fb.textContent='';fb.className='submit-status';
  const payload={studentName:S.name,className:S.className,teacherName:S.teacherName,appName:UNIT_NAME,appId:UNIT_ID,score:pct,correctAnswers:S.score,totalQuestions:10};
  try{
    const response=await fetch(SUBMISSION_URL,{method:'POST',body:JSON.stringify(payload)});
    const text=await response.text();let result=null;try{result=JSON.parse(text)}catch(_e){}
    if(!response.ok||(result&&result.success===false))throw new Error(result&&result.message?result.message:'השליחה נכשלה');
    S.submitted=true;btn.textContent='✓ התוצאה נשלחה';fb.textContent='התוצאה נשלחה למורה בהצלחה.';fb.className='submit-status ok';
  }catch(err){
    console.error('Submission failed:',err);btn.disabled=false;btn.textContent='נסה לשלוח שוב';fb.textContent='השליחה לא הושלמה. בדקו חיבור לאינטרנט ונסו שוב.';fb.className='submit-status bad';
  }
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function restartAll(){S.stage=0;S.name='';S.className='';S.teacherName='';S.submitted=false;S.questions=[];S.i=0;S.score=0;S.attempts=0;S.results=[];S.hadError=false;updateStepper();render()}
async function downloadCert(){const el=document.getElementById('certificate'),canvas=await html2canvas(el,{scale:2,backgroundColor:'#fff'}),a=document.createElement('a');a.download='תעודת-פתיחת-סוגריים-שלב-ב.png';a.href=canvas.toDataURL('image/png');a.click()}
window.addEventListener('load',()=>{updateStepper();render()});
</script></body></html>
